{% extends "base.html" %}
{% block title %}{{ tr('login') }}{% endblock %}

{% block body %}
{% include 'partials/quote.html' %}
<div class="form-title">{{ tr('login') }}</div>
<form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>{{ tr('username_lbl') }}</label>
  <input type="text" name="username" list="knownUsers" placeholder="{{ tr('username_ph') }}"
         required autocomplete="username">
  <datalist id="knownUsers">
    {% for name in known_users %}<option value="{{ name }}">{% endfor %}
  </datalist>
  <label>{{ tr('password_lbl') }}</label>
  <input type="password" name="password" placeholder="{{ tr('password_ph') }}"
         required autocomplete="current-password">
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:400;font-size:.85rem;color:var(--text2);letter-spacing:0;cursor:pointer;margin:2px 0 14px">
    <input type="checkbox" name="remember" value="1" style="width:15px;height:15px;margin:0;accent-color:var(--gold)">
    {{ tr('remember_me') }}
  </label>
  <button class="btn br">{{ tr('login') }} →</button>
</form>
<div class="dvd"></div>
<p style="text-align:center;font-size:.8rem;color:var(--text3);margin-bottom:10px">{{ tr('no_account') }}</p>
<a href="{{ url_for('auth.register') }}" class="btn bgh" style="display:block;text-align:center">
  {{ tr('create_account') }}
</a>
{% endblock %}
