{% extends "base.html" %}
{% block title %}{{ tr('login') }}{% endblock %}

{% block body %}
<!-- Floating Upper-Middle Theme Switcher Bar -->
<div class="auth-theme-switcher" aria-label="Theme Selector">
  <span class="ats-label">Theme:</span>
  <button type="button" class="ats-btn active" onclick="setLoginTheme('default')" id="thm-default">
    <span>☀️</span> Default
  </button>

  <!-- Added Requested Theme: Mountain Night with Moon -->
  <button type="button" class="ats-btn thm-night-btn" onclick="setLoginTheme('mountain-night')" id="thm-mountain-night">
    <span>🌙</span> Mountain Night
  </button>
</div>

{% include 'partials/quote.html' %}

<div class="form-title">{{ tr('login') }}</div>
<form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="username">{{ tr('username_lbl') }}</label>
  <input type="text" id="username" name="username" placeholder="{{ tr('username_ph') }}"
         required autocomplete="username" autocapitalize="none" spellcheck="false">

  <label for="password">{{ tr('password_lbl') }}</label>
  <div class="pw-wrap">
    <input type="password" id="password" name="password" placeholder="{{ tr('password_ph') }}"
           required autocomplete="current-password">
    {% include 'partials/pw_toggle.html' %}
  </div>

  <label class="remember-label">
    <input type="checkbox" name="remember" value="1" class="remember-checkbox">
    {{ tr('remember_me') }}
  </label>
  
  <button type="submit" class="btn br">{{ tr('login') }} →</button>
</form>

<div class="dvd"></div>

<p class="no-account-text">{{ tr('no_account') }}</p>
<a href="{{ url_for('auth.register') }}" class="btn bgh auth-register-btn">
  {{ tr('create_account') }}
</a>
{% endblock %}

{% block page_scripts %}
<script>
// Password reset guard before form submit
document.getElementById('loginForm').addEventListener('submit', function () {
  const pw = document.getElementById('password');
  if (pw.type !== 'password') pw.type = 'password';
});

// Switcher logic for Login themes (default & Mountain Night with Moon)
function setLoginTheme(themeName) {
  const body = document.body;
  const html = document.documentElement;
  
  // Remove existing login theme classes
  body.classList.remove('theme-mountain-night');
  html.removeAttribute('data-login-theme');
  
  document.querySelectorAll('.ats-btn').forEach(btn => btn.classList.remove('active'));

  if (themeName === 'mountain-night') {
    body.classList.add('theme-mountain-night');
    html.setAttribute('data-login-theme', 'mountain-night');
    document.getElementById('thm-mountain-night').classList.add('active');
    localStorage.setItem('login_theme', 'mountain-night');
  } else {
    document.getElementById('thm-default').classList.add('active');
    localStorage.setItem('login_theme', 'default');
  }
}

// Restore saved login theme preference on load
(function() {
  const savedTheme = localStorage.getItem('login_theme');
  if (savedTheme === 'mountain-night') {
    setLoginTheme('mountain-night');
  }
})();
</script>
{% endblock %}
